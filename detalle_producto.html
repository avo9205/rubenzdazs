<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RubenzDazs - Detalle del Producto</title>
    
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/iconos/rdfavicon.ico">
    <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/menus.css">
    <!-- <link rel="stylesheet" href="assets/css/collection.css"> -->
     <link rel="stylesheet" href="assets/css/detalle.css"> <!-- Nuevo CSS -->
     <script src="assets/js/analitica.js" defer></script>
</head>

<body>
    <div class="grid-container">
        
        <!-- ========================================== -->
        <!-- 1. HEADER (Se inyecta automáticamente)     -->
        <!-- ========================================== -->
        <header class="box-header" id="template-header"></header>

        <!-- ========================================== -->
        <!-- COMIENZA CONTENIDO ÚNICO DE ESTA PÁGINA    -->
        <!-- ========================================== -->
    <main class="box-main detail-main" id="product-container" style="display: none;">
            
                <!-- Izquierda: Galería de Imágenes -->
                <div class="gallery-section">
                    <div class="thumbnails-container" id="gallery-thumbnails">
                        <!-- Miniaturas inyectadas por JS -->
                    </div>
                    <div class="main-image-container">
                        <img id="main-image" src="" alt="Producto">
                    </div>
                </div>

                <!-- Derecha: Información del Producto -->
                <div class="info-section">
                    <h1 class="product-title" id="detail-title">Cargando...</h1>
                    <p class="product-ref" id="detail-ref">REF: ---</p>
                    
                    <div class="price-box" id="detail-price">
                        <!-- Precio inyectado por JS -->
                    </div>

                    <!-- Selectores -->
                    <div class="options-group">
                        <label class="group-label">Tipo de Prenda:</label>
                        <div class="types-wrapper" id="detail-types"></div>
                    </div>

                    <div class="options-group">
                        <label class="group-label">Talla:</label>
                        <div class="size-header-wrapper">
                            <div class="sizes-wrapper" id="detail-sizes"></div>
                            <button class="size-guide-btn" id="btn-size-guide">GUÍA DE TALLAS</button>
                        </div>
                    </div>

                    <div class="options-group">
                        <label class="group-label">Color: <span id="color-label-name"></span></label>
                        <div class="colors-wrapper" id="detail-colors"></div>
                    </div>

                    <!-- Acciones de Compra -->
                    <div class="purchase-actions">
                        <div class="quantity-box">
                            <button id="qty-minus">-</button>
                            <input type="number" id="qty-input" value="1" min="1" readonly>
                            <button id="qty-plus">+</button>
                        </div>
                        <button class="btn-brutalist btn-add-cart" id="btn-add-cart">Añadir al carrito</button>
                    </div>
                   
                    <button class="btn-brutalist btn-buy-now" id="btn-buy-now">
                        <img src="assets/img/iconos/whatsapp.png" alt="WA" style="width: 30px; margin-right: 5px;">
                        Comprar por WhatsApp
                    </button>

                    <!-- Acordeones de Detalles -->
                    <div class="details-accordion">
                        <details class="brutalist-accordion">
                            <summary>Descripción del Diseño</summary>
                            <div class="accordion-content">
                                <p id="desc-diseno"></p>
                            </div>
                        </details>
                        
                        <details class="brutalist-accordion">
                            <summary>Detalles de la Prenda</summary>
                            <div class="accordion-content">
                                <p id="desc-prenda"></p>
                                <p style="margin-top:10px;"><strong>Cuidados:</strong> <span id="care-prenda"></span></p>
                            </div>
                        </details>

                        <details class="brutalist-accordion">
                            <summary>Envíos y Devoluciones</summary>
                            <div class="accordion-content">
                                <p id="policy-prenda"></p>
                            </div>
                        </details>
                    </div>
                </div>



                <div id="loading-state" style="padding: 50px; text-align: center; font-weight: 900;">Cargando información del diseño...</div>
            <div id="error-state" style="padding: 50px; text-align: center; color: red; font-weight: 900; display: none;">Producto no encontrado.</div>



             <!-- MODAL GUÍA DE TALLAS -->
        <div id="size-modal" class="modal-overlay hidden">
            <div class="modal-box brutalist-modal">
                <button id="close-modal" class="btn-close-modal">&times;</button>
                <h2 style="margin-top: 0; text-transform: uppercase;">Guía de Tallas</h2>
                <p id="modal-garment-type" style="margin-bottom: 15px; font-weight: bold;"></p>
                <img id="modal-guide-img" src="" alt="Guía de tallas" style="width: 100%; border: 3px solid black;">
            </div>
        </div>

        <script src="assets/js/detalle.js"></script> <!-- Nuevo JS -->
    </main>


        <aside class="box-sidebar">
            <div class="ticker-track">
                 <p class="ticker-text">📢 ¡ Envios a Todo el Pais !.</p>
                <p class="ticker-text">🚀 Por compras de 150000$ el envio es Gratis. </p>
            </div>
        </aside>
        <!-- ========================================== -->
        <!-- FIN DEL CONTENIDO ÚNICO DE ESTA PÁGINA     -->
        <!-- ========================================== -->

        <!-- ========================================== -->
        <!-- 2. SOCIAL MEDIA (Se inyecta automáticamente)-->
        <!-- ========================================== -->
        <div class="box-socialmedia" id="template-social"></div>

        <!-- ========================================== -->
        <!-- 3. FOOTER (Se inyecta automáticamente)      -->
        <!-- ========================================== -->
        <footer class="box-footer" style="background-color: #292929; color: whitesmoke;" id="template-footer"></footer>
    </div>

    <!-- ========================================== -->
    <!-- 4. MENÚS OCULTOS (Se inyecta automáticamente) -->
    <!-- ========================================== -->
    <div id="template-menus"></div>
    
   <!-- ========================================== -->
    <!-- SCRIPTS (El orden es vital)                -->
    <!-- ========================================== -->
    <script src="assets/js/components.js" defer></script> 
    <script src="assets/js/carrito.js" defer></script>
    <script src="assets/js/index.js" defer></script>
    <script src="assets/js/card_ropa.js" defer></script>
    <script src="assets/js/seguridad.js" defer></script>


   

</body> 
</html>
