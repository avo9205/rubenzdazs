<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RubenzDazs</title>
    
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/iconos/rdfavicon.ico">
    <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/menus.css">
    <link rel="stylesheet" href="assets/css/collection.css">
    <script src="assets/js/analitica.js"></script>

</head>




<body>
   <div class="grid-container">
        
        <!-- ========================================== -->
        <!-- 1. HEADER (Se inyecta automáticamente)     -->
        <!-- ========================================== -->
        <header class="box-header" id="template-header"></header>

        <!-- ========================================== -->
        <!-- 2. BANNER DE PRENDA (Ahora parte del Grid) -->
        <!-- ========================================== -->
        <div id="banner-prenda-container" class="box-banner-top"></div>

        <!-- ========================================== -->
        <!-- COMIENZA CONTENIDO ÚNICO DE ESTA PÁGINA    -->
        <!-- ========================================== -->
       <main class="box-main">
            <!-- Contenedor del Menú (Filtros y Botón) -->
            <div class="sticky-header">
                <div class="filters-container" id="filtros-diseno"></div>
                <div style="width: 100%; display: flex; justify-content: flex-end; padding-bottom: 10px; background-color: #f4f4f4;">
                    <button id="view-toggle-btn" class="filter-btn" style="margin-right: 40px;">Vista Ampliada ⊟</button>
                </div>
            </div>

            <!-- 🟢 NUEVO CONTENEDOR ENVOLVENTE (Este tendrá el scroll) -->
            <div class="scroll-productos">
                <div class="product-grid" id="contenedor-productos">
                    <!-- Los productos se cargan aquí mediante JS -->
                </div>

                <div class="load-more-container" id="load-more-container" style="display: none;">
                    <button id="load-more-btn" class="btn-load-more">Cargar Más Diseños</button>
                </div>
            </div>
            <!-- 🟢 FIN DEL NUEVO CONTENEDOR -->
        </main>

        <aside class="box-sidebar">
            <div class="ticker-track">
                 <p class="ticker-text">📢 ¡ Envios a Todo el Pais !.</p>
                <p class="ticker-text">🚀 Por compras de 150000$ el envio es Gratis. </p>
            </div>
        </aside>
        <!-- ========================================== -->
        <!-- FIN DEL CONTENIDO ÚNICO DE ESTA PÁGINA     -->
        <!-- ========================================== -->

        <!-- ========================================== -->
        <!-- 2. SOCIAL MEDIA (Se inyecta automáticamente)-->
        <!-- ========================================== -->
        <div class="box-socialmedia" id="template-social"></div>

        <!-- ========================================== -->
        <!-- 3. FOOTER (Se inyecta automáticamente)      -->
        <!-- ========================================== -->
        <footer class="box-footer" style="background-color: #292929; color: whitesmoke;" id="template-footer"></footer>
    </div>

    <!-- ========================================== -->
    <!-- 4. MENÚS OCULTOS (Se inyecta automáticamente) -->
    <!-- ========================================== -->
    <div id="template-menus"></div>
    
    <!-- ========================================== -->
    <!-- SCRIPTS (El orden es vital)                -->
    <!-- ========================================== -->
    <!-- components.js DEBE ir primero para crear el HTML antes de que index.js intente leerlo -->
    <script src="assets/js/components.js"></script> 
    <script src="assets/js/carrito.js"></script>
    <script src="assets/js/index.js"></script>
    <script src="assets/js/card_ropa.js"></script>
    <script src="assets/js/seguridad.js"></script>

    <!-- SCRIPT DE LÓGICA "CARGAR MÁS" Y CAMBIO DE VISTA -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /* --- LÓGICA DE CARGAR MÁS --- */
            const loadMoreBtn = document.getElementById('load-more-btn');
            const loadMoreContainer = document.getElementById('load-more-container');
            const grid = document.getElementById('contenedor-productos');
            const filtrosContainer = document.getElementById('filtros-diseno');
            
            const itemsPerLoad = 8; // Cambiado a 10 productos por carga
            let currentLimit = itemsPerLoad;

            // Escuchar clics en los filtros para reiniciar el contador a 10
            if(filtrosContainer) {
                filtrosContainer.addEventListener('click', (e) => {
                    if (e.target.classList.contains('filter-btn')) {
                        currentLimit = itemsPerLoad;
                    }
                });
            }

            function updateVisibility() {
                if (!grid) return;
                const allCards = grid.querySelectorAll('.product-card');
                if (allCards.length === 0) {
                    loadMoreContainer.style.display = 'none';
                    return;
                }

                // Calcula cuántos diseños faltan por mostrar
                let remaining = allCards.length - currentLimit;
                if (remaining < 0) remaining = 0;

                // Mostrar u ocultar tarjetas según el límite actual
                allCards.forEach((card, index) => {
                    if (index < currentLimit) {
                        card.classList.remove('hidden');
                        card.style.display = ''; 
                    } else {
                        card.classList.add('hidden');
                        card.style.display = 'none'; 
                    }
                });

                // Si aún hay tarjetas ocultas, actualizar el botón con la cantidad restante
                if (remaining > 0) {
                    loadMoreContainer.style.display = 'flex';
                    if (loadMoreBtn) {
                        loadMoreBtn.innerText = `Cargar Más Diseños (${remaining} restantes)`;
                    }
                } else {
                    loadMoreContainer.style.display = 'none';
                }
            }

            // Acción del botón "Cargar Más"
            if (loadMoreBtn) {
                loadMoreBtn.addEventListener('click', () => {
                    currentLimit += itemsPerLoad; // Aumentamos en 10 más
                    updateVisibility();
                });
            }

            // El observador detecta cuando se insertan los productos 
            // desde card_ropa.js y actualiza la vista
            if (grid) {
                const observer = new MutationObserver((mutations) => {
                    // Verificamos si la lista se vació (ej. al cambiar de filtro rápido)
                    const currentCount = grid.querySelectorAll('.product-card').length;
                    if (currentCount === 0) {
                        currentLimit = itemsPerLoad;
                    }
                    updateVisibility();
                });
                // Escuchamos el árbol de nodos completo
                observer.observe(grid, { childList: true, subtree: true });
            }

           /* --- LÓGICA DE CAMBIO DE VISTA (Estándar e-commerce) --- */
            const viewToggleBtn = document.getElementById('view-toggle-btn');
            if(viewToggleBtn) {
                viewToggleBtn.addEventListener('click', () => {
                    grid.classList.toggle('single-view');
                    if(grid.classList.contains('single-view')) {
                        // Cuando están gigantes, el botón te invita a volver a la cuadrícula
                        viewToggleBtn.innerText = "Vista Cuadrícula ⊞";
                    } else {
                        // Cuando hay muchos, el botón te invita a ampliarlos
                        viewToggleBtn.innerText = "Vista Ampliada ⊟";
                    }
                });
            }
        });
    </script>

    




</body> 
</html>
